name: Adicionar premios de Selene

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-selene-prizes.yml'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Aplicar premios na noticia
        run: python scripts/add_selene_prizes.py

      - name: Validar atualizacao
        run: |
          grep -q "tradução para o inglês" index.html
          grep -q "um ano de assessoria de marketing digital" index.html

      - name: Publicar e limpar arquivos temporarios
        run: |
          rm -f scripts/add_selene_prizes.py
          rm -f .github/workflows/add-selene-prizes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Adiciona premios de traducao e marketing para Selene"
          git push origin main
