name: Finalizar Copa Apocrifos 2026

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/finalize-copa-2026.yml'

permissions:
  contents: write

jobs:
  finalizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencia
        run: python -m pip install --quiet beautifulsoup4

      - name: Aplicar resultado da final
        run: python scripts/finalize_copa_2026.py

      - name: Validar resultado
        run: |
          grep -q "Selene é campeã da Copa Apócrifos 2026" index.html
          grep -q "77 × 49 votos válidos" index.html
          grep -q "230</strong><span>votos válidos acumulados" index.html

      - name: Publicar e limpar arquivos temporarios
        run: |
          rm -f scripts/finalize_copa_2026.py
          rm -f .github/workflows/finalize-copa-2026.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consagra Selene campea da Copa Apocrifos 2026"
          git push origin main
