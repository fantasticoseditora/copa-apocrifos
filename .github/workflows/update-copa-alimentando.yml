name: Atualizar Copa Apocrifos - Grupo F

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-copa-alimentando.yml'
      - 'scripts/update_copa_alimentando.py'

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependência
        run: python -m pip install --quiet beautifulsoup4

      - name: Atualizar página
        run: python scripts/update_copa_alimentando.py

      - name: Remover arquivos temporários e publicar
        run: |
          rm -f scripts/update_copa_alimentando.py
          rm -f .github/workflows/update-copa-alimentando.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Atualiza Alimentando o Pecado x Contos da Terra Legendária"
          git push origin main

