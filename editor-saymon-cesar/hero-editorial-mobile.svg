<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">Livro aberto em um escritório editorial iluminado</title>
  <desc id="desc">Ilustração vetorial em tons escuros e dourados com livro aberto, caneta-tinteiro, volumes empilhados e luz quente.</desc>
  <defs>
